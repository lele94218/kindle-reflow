[project]
name = "kindle-reflow"
version = "0.1.0"
description = "Image-level PDF reflow for Kindle e-readers. Detects columns, crops regions, applies uniform scaling. No OCR — tables, figures, and formulas stay intact."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
]

[project.scripts]
kindle-reflow = "kindle_reflow:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
